<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patients | QueueBase</title><link rel="stylesheet" th:href="@{/css/queuebase.css}"><script defer th:src="@{/js/queuebase.js}"></script>
</head>
<body data-page="patients">
<div th:replace="~{fragments :: header('patients')}"></div>
<main class="page-shell">
    <section class="page-heading"><div><p class="eyebrow">PATIENT DIRECTORY</p><h1>Patients</h1><p class="subheading">Keep registration details ready for the next visit.</p></div></section>
    <div class="workspace-grid">
        <section class="content-panel form-panel"><div class="section-heading"><div><p class="eyebrow">PATIENT DETAILS</p><h2 id="patient-form-title">Register patient</h2></div></div>
            <form id="patient-form" class="stack-form">
                <label>Full name<input name="name" required maxlength="120" autocomplete="name"></label>
                <label>Age<input name="age" type="number" min="1" max="130" required></label>
                <label>Phone<input name="phone" type="tel" required maxlength="24" autocomplete="tel"></label>
                <label>Gender<input name="gender" required maxlength="40"></label>
                <div class="form-actions"><button class="button button-primary" type="submit" id="patient-submit">Save patient</button><button class="button button-quiet" type="reset" id="patient-cancel" hidden>Cancel edit</button></div>
                <p class="notice" id="patient-notice" role="status"></p>
            </form>
        </section>
        <section class="content-panel"><div class="section-heading"><div><p class="eyebrow">REGISTERED PATIENTS</p><h2>Patient list</h2></div><span class="count-label" id="patient-list-count">—</span></div>
            <div class="table-scroll"><table><thead><tr><th>Name</th><th>Age</th><th>Phone</th><th>Gender</th><th>Actions</th></tr></thead><tbody id="patient-rows"></tbody></table></div>
        </section>
    </div>
</main>
</body>
</html>
